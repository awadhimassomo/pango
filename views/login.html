<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in – Pango Homes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top"><h1><a href="/" style="color:inherit;text-decoration:none">🏡 Pango Homes</a></h1></header>
  <main style="max-width:420px">
    <form id="authForm" class="filters" style="flex-direction:column;align-items:stretch">
      <h2 id="title">Sign in</h2>
      <input name="name" placeholder="Name" hidden>
      <input name="email" type="email" placeholder="Email" required>
      <input name="password" type="password" placeholder="Password (8+ chars)" minlength="8" required>
      <select name="role" hidden><option value="user">I am looking for a home</option><option value="agent">I list homes (agent)</option></select>
      <p id="error" style="color:#dc2626;margin:0" role="alert"></p>
      <button id="submit">Sign in</button>
      <a href="#" id="switch">Need an account? Register</a>
    </form>
  </main>
  <script src="auth.js"></script>
  <script>
    let mode = 'login';
    const f = document.getElementById('authForm');
    document.getElementById('switch').onclick = (e) => {
      e.preventDefault();
      mode = mode === 'login' ? 'register' : 'login';
      const reg = mode === 'register';
      f.name.hidden = f.role.hidden = !reg;
      f.name.required = reg;
      document.getElementById('title').textContent = reg ? 'Create account' : 'Sign in';
      document.getElementById('submit').textContent = reg ? 'Register' : 'Sign in';
      e.target.textContent = reg ? 'Have an account? Sign in' : 'Need an account? Register';
    };
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(f));
      const res = await fetch('/api/auth/' + mode, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) { document.getElementById('error').textContent = (data.errors || [data.error]).join(', '); return; }
      Auth.save(data);
      location.href = '/';
    });
  </script>
</body>
</html>
